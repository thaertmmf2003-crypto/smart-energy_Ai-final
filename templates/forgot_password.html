<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · Smart Energy AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/i18n_theme.js') }}"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div style="position: absolute; top: 24px; right: 28px; display: flex; gap: 12px; z-index: 10;">
      <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme(event)" title="Toggle Theme">☀️</button>
      <button class="lang-toggle-btn" id="lang-toggle" onclick="toggleLanguage(event)" title="Toggle Language">العربية</button>
    </div>

    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="auth-brand-mark">🔑</div>
        <h2 data-i18n="auth_forgot_title">Reset Password</h2>
        <p data-i18n="auth_forgot_sub">Enter your registered email address to receive a verification code</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
            {% for category, message in messages %}
              <div class="flash-alert alert-{{ category }}" style="padding: 10px 14px; font-size: 12px;">
                <span>{{ message }}</span>
                <button type="button" class="alert-close" onclick="this.parentElement.remove()">×</button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email" data-i18n="auth_email_label">Email Address</label>
          <div class="form-input-wrap">
            <input type="email" id="email" name="email" class="form-input" value="{{ email or '' }}" placeholder="e.g. user@smartenergy.ai" required autofocus>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="hero-action full" style="margin-top: 8px;" data-i18n="auth_send_reset_code">Send Verification Code</button>
      </form>

      <div class="auth-footer">
        <span data-i18n="auth_remember_pwd">Remember your password?</span>
        <a href="{{ url_for('auth.login') }}" data-i18n="auth_login_link">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('.auth-form').addEventListener('submit', function() {
      const btn = document.getElementById('submit-btn');
      if (btn) {
        btn.style.opacity = '0.7';
        btn.style.cursor = 'wait';
        btn.textContent = (document.documentElement.lang === 'ar' ? 'جاري إرسال الرمز...' : 'Sending code...');
      }
    });
  </script>
</body>
</html>
