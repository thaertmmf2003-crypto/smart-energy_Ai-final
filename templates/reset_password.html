<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password · Smart Energy AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/i18n_theme.js') }}"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div style="position: absolute; top: 24px; right: 28px; display: flex; gap: 12px; z-index: 10;">
      <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme(event)" title="Toggle Theme">☀️</button>
      <button class="lang-toggle-btn" id="lang-toggle" onclick="toggleLanguage(event)" title="Toggle Language">العربية</button>
    </div>

    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="auth-brand-mark">🔐</div>
        <h2 data-i18n="auth_reset_title">Set New Password</h2>
        <p data-i18n="auth_reset_sub">Create a strong new password for your account</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
            {% for category, message in messages %}
              <div class="flash-alert alert-{{ category }}" style="padding: 10px 14px; font-size: 12px;">
                <span>{{ message }}</span>
                <button type="button" class="alert-close" onclick="this.parentElement.remove()">×</button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.reset_password') }}" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="new_password" data-i18n="auth_new_password_label">New Password</label>
          <div class="form-input-wrap">
            <input type="password" id="new_password" name="new_password" class="form-input" placeholder="Min. 6 characters" minlength="6" required autofocus>
            <button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility('new_password', this)" title="Show/Hide Password">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password" data-i18n="auth_confirm_password_label">Confirm Password</label>
          <div class="form-input-wrap">
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repeat your new password" minlength="6" required>
            <button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility('confirm_password', this)" title="Show/Hide Password">👁</button>
          </div>
        </div>

        <button type="submit" id="save-btn" class="hero-action full" style="margin-top: 8px;" data-i18n="auth_save_new_pwd">Save New Password & Sign In</button>
      </form>

      <div class="auth-footer">
        <a href="{{ url_for('auth.login') }}" data-i18n="auth_cancel_back_login">Cancel & Return to Sign In</a>
      </div>
    </div>
  </div>

  <script>
    function togglePwdVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🔒';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    document.querySelector('.auth-form').addEventListener('submit', function() {
      const btn = document.getElementById('save-btn');
      if (btn) {
        btn.style.opacity = '0.7';
        btn.style.cursor = 'wait';
        btn.textContent = (document.documentElement.lang === 'ar' ? 'جاري تحديث كلمة المرور...' : 'Saving password...');
      }
    });
  </script>
</body>
</html>
